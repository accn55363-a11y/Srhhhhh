name: Persistent Windows RDP (Self-hosted)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persistent-rdp
  cancel-in-progress: false

jobs:
  secure-rdp:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Configure secure RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Add the RDP_PASSWORD repository secret first."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser -Name "RDP" `
              -Password $securePassword `
              -AccountNeverExpires | Out-Null
          } else {
            Set-LocalUser -Name "RDP" -Password $securePassword
            Enable-LocalUser -Name "RDP"
          }

          Add-LocalGroupMember -Group "Administrators" `
            -Member "RDP" -ErrorAction SilentlyContinue

          Add-LocalGroupMember -Group "Remote Desktop Users" `
            -Member "RDP" -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name SecurityLayer -Value 2

          Get-NetFirewallRule -DisplayName "RDP-Tailscale" `
            -ErrorAction SilentlyContinue | Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Action Allow | Out-Null

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

      - name: Verify existing Tailscale connection
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
            throw "Tailscale is not installed on this Windows runner."
          }

          $status = & $tailscale status
          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale is not connected. Sign in on the Windows host first."
          }

          $ip = (& $tailscale ip -4 | Select-Object -First 1).Trim()

          if (!$ip) {
            throw "No Tailscale IPv4 address was found."
          }

          "RDP address: $ip" | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY -Append

          "Username: RDP" | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY -Append

          "RDP is configured. Keep the Windows runner online." |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Verify RDP listener
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $listener = Get-NetTCPConnection `
            -State Listen -LocalPort 3389 `
            -ErrorAction SilentlyContinue

          if (!$listener) {
            throw "RDP is not listening on TCP port 3389."
          }

          Write-Host "RDP listener is active."
